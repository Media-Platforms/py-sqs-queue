---
name: Build
on:
  pull_request:
    branches:
      - master
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e . pytest pytest-cov

      - name: Run tests
        run: coverage run -m pytest && coverage report --fail-under=100

      - name: Backstage entity validator
        uses: RoadieHQ/backstage-entity-validator@v0.6.0
